version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: kisansetu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kisansetu}
      MYSQL_USER: ${MYSQL_USER:-kisansetu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kisansetu123}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - kisansetu_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword123}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  kisansetu_mysql_data:
