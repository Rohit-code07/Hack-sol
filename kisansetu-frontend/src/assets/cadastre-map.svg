<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" fill="none" className="w-full h-auto">
  <!-- Cadastral Village Map Background -->
  <rect width="500" height="320" rx="4" fill="#FBF8F1" stroke="#1E1B4B" stroke-width="2"/>
  
  <!-- Subtle Cadastral Grid lines -->
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#E8DEC4" stroke-width="0.75"/>
    </pattern>
  </defs>
  <rect width="500" height="320" fill="url(#grid)" />

  <!-- Village Canal (Nehar) -->
  <path d="M0 60 Q 150 80, 260 40 T 500 70" stroke="#38BDF8" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.6"/>
  <text x="70" y="52" font-family="'Noto Sans', sans-serif" font-size="9" font-weight="700" fill="#0284C7">मुख्य सिंचाई नहर (Canal)</text>

  <!-- Village Road (Sadak) -->
  <path d="M 60 320 L 140 160 L 280 150 L 440 0" stroke="#D97706" stroke-width="6" stroke-dasharray="6 4" fill="none"/>
  <text x="290" y="140" font-family="'Noto Sans', sans-serif" font-size="9" font-weight="600" fill="#B45309">ग्राम संपर्क मार्ग</text>

  <!-- Plot 42/1: Clean & Verified Parcel (Green Sage) -->
  <polygon points="120,95 240,85 220,180 100,170" fill="#E4ECE3" stroke="#487A4F" stroke-width="2"/>
  <circle cx="165" cy="130" r="14" fill="#487A4F" fill-opacity="0.15"/>
  <text x="165" y="125" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#345D3B">खसरा 42/1</text>
  <text x="165" y="138" text-anchor="middle" font-family="'Noto Sans', sans-serif" font-size="8" font-weight="600" fill="#487A4F">रामेश कुमार • 1.45 Ha</text>
  <rect x="135" y="146" width="60" height="14" rx="2" fill="#345D3B"/>
  <text x="165" y="156" text-anchor="middle" font-family="'Noto Sans', sans-serif" font-size="7.5" font-weight="700" fill="#FFFFFF">✓ बैंक हेतु सत्यापित</text>

  <!-- Plot 42/2: Pending Mutation (Yellow Ochre) -->
  <polygon points="240,85 360,75 350,170 220,180" fill="#FDF3D6" stroke="#D99B16" stroke-width="2"/>
  <text x="290" y="120" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#A97509">खसरा 42/2</text>
  <text x="290" y="133" text-anchor="middle" font-family="'Noto Sans', sans-serif" font-size="8" font-weight="600" fill="#D99B16">विरासत दर्ज • 1.20 Ha</text>
  <rect x="255" y="141" width="70" height="14" rx="2" fill="#D99B16"/>
  <text x="290" y="151" text-anchor="middle" font-family="'Noto Sans', sans-serif" font-size="7.5" font-weight="700" fill="#FFFFFF">⏳ नामांतरण प्रक्रियाधीन</text>

  <!-- Plot 43: Overlapping Bank Loan Dispute (Red Rust) -->
  <polygon points="100,170 220,180 200,280 80,260" fill="#F8E6E2" stroke="#BA3C2A" stroke-width="2"/>
  <text x="145" y="220" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#8F2618">खसरा 43</text>
  <text x="145" y="233" text-anchor="middle" font-family="'Noto Sans', sans-serif" font-size="8" font-weight="600" fill="#BA3C2A">दोहरा ऋण अलर्ट • 0.90 Ha</text>
  <rect x="110" y="241" width="70" height="14" rx="2" fill="#BA3C2A"/>
  <text x="145" y="251" text-anchor="middle" font-family="'Noto Sans', sans-serif" font-size="7.5" font-weight="700" fill="#FFFFFF">⚠ बैंक बंधक विवाद</text>

  <!-- Plot 44: Clean Farmer Plot -->
  <polygon points="220,180 350,170 340,270 200,280" fill="#E4ECE3" stroke="#487A4F" stroke-width="2"/>
  <text x="270" y="225" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#345D3B">खसरा 44</text>
  <text x="270" y="238" text-anchor="middle" font-family="'Noto Sans', sans-serif" font-size="8" font-weight="600" fill="#487A4F">सुनील पाटिल • 2.10 Ha</text>
  <rect x="240" y="246" width="60" height="14" rx="2" fill="#345D3B"/>
  <text x="270" y="256" text-anchor="middle" font-family="'Noto Sans', sans-serif" font-size="7.5" font-weight="700" fill="#FFFFFF">✓ KCC स्वीकृत</text>

  <!-- Map Compass North Indicator -->
  <g transform="translate(450, 40)">
    <circle cx="15" cy="15" r="14" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1.5"/>
    <path d="M 15 5 L 18 15 L 15 13 L 12 15 Z" fill="#BA3C2A"/>
    <path d="M 15 25 L 18 15 L 15 17 L 12 15 Z" fill="#1E1B4B"/>
    <text x="15" y="4" text-anchor="middle" font-family="'Noto Sans', sans-serif" font-size="8" font-weight="800" fill="#BA3C2A">उ (N)</text>
  </g>

  <!-- Bottom Legend Bar -->
  <rect x="10" y="288" width="480" height="24" rx="2" fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1"/>
  <circle cx="30" cy="300" r="4" fill="#487A4F"/>
  <text x="40" y="303" font-family="'Noto Sans', sans-serif" font-size="8.5" font-weight="600" fill="#1E1B4B">सत्यापित/पात्र (Verified)</text>

  <circle cx="160" cy="300" r="4" fill="#D99B16"/>
  <text x="170" y="303" font-family="'Noto Sans', sans-serif" font-size="8.5" font-weight="600" fill="#1E1B4B">नामांतरण प्रक्रियाधीन (Pending)</text>

  <circle cx="310" cy="300" r="4" fill="#BA3C2A"/>
  <text x="320" y="303" font-family="'Noto Sans', sans-serif" font-size="8.5" font-weight="600" fill="#1E1B4B">दोहरा बैंक बंधक विवाद (Disputed)</text>

  <text x="480" y="303" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#B85028">GIS भूलेख स्तर v2.4</text>
</svg>
