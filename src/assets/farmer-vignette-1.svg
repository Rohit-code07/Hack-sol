<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Vibrant, Fully Solid Annadata Farmer Illustration (Transparent Canvas, Solid Artwork) -->
  <!-- Outer decorative border ring -->
  <circle cx="60" cy="60" r="56" stroke="#8C3B1E" stroke-width="2"/>
  <circle cx="60" cy="60" r="51" stroke="#FF9933" stroke-width="1.5" stroke-dasharray="3 3"/>
  
  <!-- Sun in vibrant saffron -->
  <circle cx="84" cy="34" r="12" fill="#FF9933" opacity="0.3" stroke="#FF9933" stroke-width="1.5"/>
  <line x1="84" y1="18" x2="84" y2="14" stroke="#FF9933" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="100" y1="34" x2="104" y2="34" stroke="#FF9933" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Fertile green farm field -->
  <path d="M12 90C36 78 84 82 108 90V100H12V90Z" fill="#D1E7DD" stroke="#138808" stroke-width="1.5"/>

  <!-- Farmer Kurta & Shoulders -->
  <path d="M38 86C40 65 50 63 60 63C70 63 80 65 82 86V96H38V86Z" fill="#B85028" stroke="#8C3B1E" stroke-width="1.8"/>

  <!-- Farmer Face & Neck -->
  <circle cx="60" cy="48" r="9" fill="#F5E6CA" stroke="#8C3B1E" stroke-width="1.6"/>
  <circle cx="57" cy="46" r="1.2" fill="#1E1B4B"/>
  <circle cx="63" cy="46" r="1.2" fill="#1E1B4B"/>
  <path d="M54 52Q60 56 66 52" stroke="#1E1B4B" stroke-width="2" stroke-linecap="round"/> <!-- Mustache -->

  <!-- Vibrant Saffron Turban (पाग/पगड़ी) -->
  <path d="M44 42C44 32 52 24 62 24C72 24 78 30 78 38C78 44 72 46 68 48C64 50 56 50 52 48C48 45 44 44 44 42Z" fill="#FF9933" stroke="#B85028" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M48 36C54 32 68 32 74 36" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Golden Wheat Stalks -->
  <path d="M76 86C80 66 88 52 92 46" stroke="#D97706" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M86 56L94 52M82 64L90 60M78 72L86 68" stroke="#D97706" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Bottom Badge Ribbon -->
  <rect x="22" y="96" width="76" height="18" rx="3" fill="#1E1B4B" stroke="#FF9933" stroke-width="1.5"/>
  <text x="60" y="108" text-anchor="middle" font-family="'Tiro Devanagari Hindi', serif" font-size="8.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">अन्नदाता • KISAN</text>
</svg>
