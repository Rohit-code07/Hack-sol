<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Vibrant Public Grievance Lokpal Scales of Justice (Solid Artwork, Full Color) -->
  <circle cx="60" cy="60" r="56" stroke="#1E1B4B" stroke-width="2"/>
  <circle cx="60" cy="60" r="51" stroke="#D97706" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Central Pillar in Royal Indigo & Gold -->
  <line x1="60" y1="22" x2="60" y2="76" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="20" r="4" fill="#D97706" stroke="#1E1B4B" stroke-width="1.5"/>
  <line x1="42" y1="76" x2="78" y2="76" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round"/>

  <!-- Horizontal Beam in Gold -->
  <line x1="30" y1="32" x2="90" y2="32" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="30" cy="32" r="3" fill="#1E1B4B" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="90" cy="32" r="3" fill="#1E1B4B" stroke="#D97706" stroke-width="1.5"/>

  <!-- Left Scale Pan in Brass/Gold -->
  <line x1="30" y1="32" x2="22" y2="52" stroke="#8C3B1E" stroke-width="1.5"/>
  <line x1="30" y1="32" x2="38" y2="52" stroke="#8C3B1E" stroke-width="1.5"/>
  <path d="M20 52C20 60 40 60 40 52Z" fill="#FDE68A" stroke="#8C3B1E" stroke-width="1.8"/>

  <!-- Right Scale Pan in Brass/Gold -->
  <line x1="90" y1="32" x2="82" y2="52" stroke="#8C3B1E" stroke-width="1.5"/>
  <line x1="90" y1="32" x2="98" y2="52" stroke="#8C3B1E" stroke-width="1.5"/>
  <path d="M80 52C80 60 100 60 100 52Z" fill="#FDE68A" stroke="#8C3B1E" stroke-width="1.8"/>

  <!-- Bottom Badge Ribbon -->
  <rect x="18" y="96" width="84" height="18" rx="3" fill="#1E1B4B" stroke="#D97706" stroke-width="1.5"/>
  <text x="60" y="108" text-anchor="middle" font-family="'Tiro Devanagari Hindi', serif" font-size="8.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">लोकपाल • LOKPAL</text>
</svg>
